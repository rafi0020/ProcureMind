# Serves the static UI and proxies /api to the API containers, so the browser talks to one origin.

# Docker's DNS. `resolve` re-reads it, so API containers added with --scale api=N join the pool; `keepalive`
# reuses connections to them. Without it every request opens a new connection, and under load the proxy runs
# out of local ports (seen at about 450 requests per second to one API container).
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 128;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 210m;   # ten documents of up to 20 MB each per upload; the inbox endpoint takes 25 MB

    # OTLP trace ingestion and live-prompt reads for applications, authenticated with an ingestion key.
    location /v1/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API must see the address nginx saw, not one the client typed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-Sent Events: pass each event through as it is written.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }
}
